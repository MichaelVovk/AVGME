[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "avgme"
version = "0.1.0"
description = "UI-level automation for Last Asylum: Plague on an Android emulator"
requires-python = ">=3.10"
dependencies = [
    "opencv-python>=4.9",
    "numpy>=1.26",
    "PyYAML>=6.0",
    "click>=8.1",
]

[project.scripts]
avgme = "avgme.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
